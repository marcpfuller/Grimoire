# Grimoire default configuration

server:
  host: "127.0.0.1"
  port: 7777

auth:
  # Path to the bearer token file used to authenticate daemon API calls.
  # The file is created on first `grim daemon start` with mode 0600.
  # Defaults to ~/.grim/token when empty or unset.
  # Example override (tmpfs — token disappears on reboot):
  #   token_path: "/run/user/1000/grim-token"
  token_path: ""

sync:
  interval_seconds: 30

ghostwriter:
  url: "http://localhost:8000"
  # Service tokens (gwst_…) scoped to one or more project oplogs.
  # Create one in GW: Profile → Service Tokens → select the project's oplog → OPLOG_RW preset.
  # Multiple tokens let a single grim instance sync across several projects.
  # Example:
  #   tokens:
  #     - "gwst_abc123..."
  #     - "gwst_def456..."
  tokens: 
    - "gwst_b8e62972ed8e6628_E8X1J6snGuIl7ks3EjADQnjmGeogkBNav-OszHRRooQ"
  # auto_sync: true  → all finalized commands are pushed automatically (default)
  # auto_sync: false → use `grim sync <short-id>` to push commands manually
  auto_sync: true

scrub:
  rules: []
  # Example rule:
  # - name: "AWS Access Key"
  #   pattern: "AKIA[0-9A-Z]{16}"
  #   replacement: "[REDACTED_AWS_KEY]"

cast:
  # Directory where .cast files are written by `grim cast`.
  # Relative paths resolve from the daemon's working directory.
  # Defaults to a `casts/` subdirectory next to db.path when empty.
  dir: ""

log:
  # Directory where grimoire.log is written. Relative paths resolve from the
  # daemon's working directory. Use an absolute path for predictability.
  dir: "."
  # Minimum level for the JSON file sink: debug | info | warn | error
  level: "info"
  # Maximum log file size in MB before rotation.
  max_mb: 50
  # Number of rotated backup files to keep.
  max_backups: 5
